[workspace]
members = [
    "crates/mdor-core",
    "crates/mdor-app",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
dioxus = "0.7.10"
sha2 = "0.10.9"
gix = "0.87"
gix-worktree = "0.56"
gix-worktree-state = "0.34"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
async-trait = "0.1"

