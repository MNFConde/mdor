name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # core-quality：PR/push 质量门禁（§12.3 core-quality，M1 起挂）
  core-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 读取 rust-toolchain.toml 钉版 1.97.1；profile=minimal 不含 rustfmt/clippy，补 components
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      # mdor-app 需系统 webkit 库，ubuntu runner 无 → clippy 限定 core；
      # app 编译检查由 M7 的 windows-desktop-check 覆盖（§12.3）
      - name: clippy
        run: cargo clippy -p mdor-core -- -D warnings
      - name: test
        run: cargo test -p mdor-core
      # 覆盖率（M2：随首个集成测试接入，taiki-e/install-action；lcov 报告归档）
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: coverage
        run: cargo llvm-cov -p mdor-core --lcov --output-path lcov.info
      - name: audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
